# 质量门禁配置
# blocked_behavior: 控制 blocked 工具在 pass rate 中的行为
#   count_as_failure  — blocked 计入失败（默认，最严格）
#   exclude           — blocked 不计入 pass rate（类似 skipped）
#   未配置时默认 count_as_failure

gates:
  # PR 级别门禁（宽松）
  pr:
    blocked_behavior: count_as_failure
    smoke_pass_rate:
      min: 100
    crash_count:
      max: 0
    lint_errors:
      max: 0

  # Main 分支门禁（标准）
  main:
    blocked_behavior: count_as_failure
    smoke_pass_rate:
      min: 100
    regression_pass_rate:
      min: 95
    crash_count:
      max: 0
    critical_bugs:
      max: 0

  # 发版门禁（严格）
  release:
    blocked_behavior: count_as_failure
    smoke_pass_rate:
      min: 100
    regression_pass_rate:
      min: 98
    compatibility_pass_rate:
      min: 90
    crash_free_rate:
      min: 99.5
    performance_regression_count:
      max: 0
    security_critical_count:
      max: 0
